apiVersion: batch/v1
kind: Job
metadata:
  name: demo-job
  namespace: nginx
spec:
  completions: 1          # Fixed typo: 'comletions' -> 'completions'
  parallelism: 1
  template:
    metadata:
      labels:
        app: batch-task
    spec:                 # This 'spec' belongs to the Pod template
      containers:
        - name: batch-container
          image: busybox:latest
          command: ["sh", "-c", "echo Hello Friend && sleep 10"]
      restartPolicy: Never
